<!-- "Driving Sustainable Growth" section: dark green glowing background, heading + bold text,
     and a glowing bulb held in a hand with eco icons around it. Slides in when it scrolls into view. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .growth { position: relative; overflow: hidden; border-radius: 14px; min-height: 430px;
    background:
      radial-gradient(circle at 82% 38%, rgba(255, 222, 60, .38) 0%, rgba(255, 222, 60, 0) 26%),
      radial-gradient(circle at 12% 18%, rgba(70, 160, 40, .55) 0%, rgba(70, 160, 40, 0) 30%),
      radial-gradient(circle at 45% 85%, rgba(30, 120, 30, .55) 0%, rgba(30, 120, 30, 0) 35%),
      radial-gradient(circle at 60% 10%, rgba(20, 90, 20, .6) 0%, rgba(20, 90, 20, 0) 30%),
      radial-gradient(circle at 28% 60%, rgba(5, 40, 5, .9) 0%, rgba(5, 40, 5, 0) 40%),
      linear-gradient(135deg, #052b07 0%, #0d4a12 35%, #062a08 65%, #031503 100%);
    display: flex; align-items: flex-start; }
  .text { position: relative; z-index: 2; width: 47%; padding: 30px 0 40px 4%; }
  h2 { font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 700;
       font-size: clamp(30px, 4.2vw, 46px); letter-spacing: 1px; color: #fff; margin: 0 0 22px 0; line-height: 1.15; }
  p  { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; font-weight: 700; color: #fff;
       font-size: clamp(15px, 1.55vw, 18.5px); line-height: 1.75; text-align: justify; margin: 0;
       word-spacing: 2px; }
  .art { position: absolute; z-index: 1; right: 0; top: 0; bottom: 0; aspect-ratio: 820 / 853; }
  .art .photo, .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art .photo { object-fit: cover; object-position: 100% 100%; filter: saturate(.7);
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 24%), linear-gradient(to bottom, transparent 0, #000 22%);
    -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to right, transparent 0, #000 24%), linear-gradient(to bottom, transparent 0, #000 22%);
            mask-composite: intersect; }

  /* Scroll-in animation (like AOS "fade-up") */
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 1s ease, transform 1s ease; }
  .reveal.in { opacity: 1; transform: none; }
  .d1 { transition-delay: .15s; } .d2 { transition-delay: .4s; } .d3 { transition-delay: .25s; }
  .art.reveal { transform: translateY(40px) scale(.94); }
  .art.reveal.in { transform: none; }

  /* Glow and twinkle */
  .glow   { animation: pulse 3.2s ease-in-out infinite; transform-origin: 516px 456px; }
  .spark  { animation: twinkle 2.4s ease-in-out infinite; }
  .spin   { animation: spin 60s linear infinite; transform-origin: 516px 456px; }
  @keyframes pulse   { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes spin    { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .growth { flex-direction: column; }
    .text { width: auto; padding: 26px 22px 10px; }
    p { text-align: left; }
    .art { position: relative; right: auto; top: auto; bottom: auto; width: 100%; aspect-ratio: 820 / 853; margin: 0; }
  }
</style>

<div class="growth" id="growth">
  <div class="text">
    <h2 class="reveal d1">__TITLE__</h2>
    <p class="reveal d2">__TEXT__</p>
  </div>

  <div class="art reveal d3">
    <!-- real photo of a bulb resting in an open hand (Pixabay, free licence) -->
    <img class="photo" src="__BULB__" alt="Light bulb glowing in an open hand">
    <!-- glowing eco-icon ring drawn on top, centred on the bulb -->
    <svg viewBox="0 0 820 853" preserveAspectRatio="xMaxYMax slice" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(400 430) scale(.56) translate(-516 -456)">
      <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6b0" stop-opacity=".25"/>
          <stop offset="45%" stop-color="#ffe14a" stop-opacity=".22"/>
          <stop offset="100%" stop-color="#ffd400" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
      </defs>
      <circle class="glow" cx="516" cy="456" r="250" fill="url(#halo)"/>
      <g class="spin"><circle cx="516" cy="456" r="455" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-dasharray="5 14"/></g>
      <circle cx="516" cy="456" r="230" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="4"/>
      <circle cx="516" cy="456" r="380" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
      <!-- spokes -->
      <g stroke="#ffe55c" stroke-width="4" stroke-opacity=".85">
        <line x1="286" y1="456" x2="198" y2="456"/><line x1="353" y1="293" x2="291" y2="231"/>
        <line x1="516" y1="226" x2="516" y2="138"/><line x1="679" y1="293" x2="741" y2="231"/>
        <line x1="746" y1="456" x2="834" y2="456"/><line x1="679" y1="619" x2="741" y2="681"/>
        <line x1="353" y1="619" x2="291" y2="681"/>
      </g>
      <!-- glowing dots -->
      <g fill="#fff59a">
        <circle class="spark" style="animation-delay:0s"   cx="286" cy="456" r="11"/>
        <circle class="spark" style="animation-delay:.3s"  cx="353" cy="293" r="11"/>
        <circle class="spark" style="animation-delay:.6s"  cx="516" cy="226" r="11"/>
        <circle class="spark" style="animation-delay:.9s"  cx="679" cy="293" r="11"/>
        <circle class="spark" style="animation-delay:1.2s" cx="746" cy="456" r="11"/>
        <circle class="spark" style="animation-delay:1.5s" cx="679" cy="619" r="11"/>
        <circle class="spark" style="animation-delay:1.8s" cx="353" cy="619" r="11"/>
      </g>
      <g fill="#fffbd0" filter="url(#soft)" opacity=".9">
        <circle cx="286" cy="456" r="20"/><circle cx="516" cy="226" r="20"/><circle cx="746" cy="456" r="20"/>
        <circle cx="353" cy="293" r="20"/><circle cx="679" cy="293" r="20"/><circle cx="679" cy="619" r="20"/><circle cx="353" cy="619" r="20"/>
      </g>
      <!-- icon badges -->
      <g fill="rgba(0,0,0,.28)" stroke="#fff" stroke-width="4" stroke-opacity=".9">
        <circle cx="136" cy="456" r="64"/><circle cx="247" cy="187" r="64"/><circle cx="516" cy="76" r="64"/>
        <circle cx="785" cy="187" r="64"/><circle cx="896" cy="456" r="64"/><circle cx="785" cy="725" r="64"/>
        <circle cx="247" cy="725" r="64"/>
      </g>
      <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- sun -->
        <g transform="translate(136 456) scale(1.6)">
          <circle r="9"/>
          <line y1="-14" y2="-22"/><line y1="14" y2="22"/><line x1="-14" x2="-22"/><line x1="14" x2="22"/>
          <line x1="10" y1="10" x2="16" y2="16"/><line x1="-10" y1="-10" x2="-16" y2="-16"/>
          <line x1="10" y1="-10" x2="16" y2="-16"/><line x1="-10" y1="10" x2="-16" y2="16"/>
        </g>
        <!-- fuel pump -->
        <g transform="translate(247 187) scale(1.6)">
          <rect x="-15" y="-18" width="20" height="32" rx="3"/><line x1="-19" y1="14" x2="9" y2="14"/>
          <path d="M5 -10 h5 a4 4 0 0 1 4 4 v12 a3 3 0 0 0 6 0 v-16 l-5 -5"/>
          <path d="M-5 -9 c-4 6 -6 9 -6 12 a6 6 0 0 0 12 0 c0 -3 -2 -6 -6 -12z" fill="#fff"/>
        </g>
        <!-- solar panel -->
        <g transform="translate(516 76) scale(1.6)">
          <path d="M-20 4 L-14 -14 H14 L20 4 Z"/><line x1="-17" y1="-5" x2="17" y2="-5"/>
          <line x1="-5" y1="-14" x2="-7" y2="4"/><line x1="5" y1="-14" x2="7" y2="4"/>
          <line y1="4" y2="18"/><line x1="-8" y1="18" x2="8" y2="18"/>
        </g>
        <!-- leaf -->
        <g transform="translate(785 187) scale(1.6)">
          <path d="M-16 16 C -18 -12, 6 -22, 20 -18 C 22 2, 10 20, -16 16 Z"/>
          <path d="M-16 16 L 14 -12"/><path d="M-4 4 l-2 -10"/><path d="M4 -4 l9 2"/>
        </g>
        <!-- sprout -->
        <g transform="translate(896 456) scale(1.6)">
          <path d="M0 12 v-26"/><path d="M0 -2 c-13 -2 -19 -11 -19 -20 c11 0 19 7 19 20z"/>
          <path d="M0 -8 c13 -2 19 -11 19 -20 c-11 0 -19 7 -19 20z"/><path d="M-13 12 h26 l-4 12 h-18 z"/>
        </g>
        <!-- wind turbine -->
        <g transform="translate(785 725) scale(1.6)">
          <line y1="0" y2="24"/><line x1="-8" y1="24" x2="8" y2="24"/>
          <path d="M0 0 L -3 -22 L 3 -22 Z" fill="#fff"/><path d="M0 0 L 20 9 L 17 14 Z" fill="#fff"/>
          <path d="M0 0 L -17 14 L -20 9 Z" fill="#fff"/><circle r="3" fill="#fff"/>
        </g>
        <!-- recycle -->
        <g transform="translate(247 725) scale(1.6)">
          <path d="M-6 -16 L 4 -16 L 12 -2"/><path d="M8 -6 l4 4 l5 -3"/>
          <path d="M16 6 L 10 16 H -4"/><path d="M0 12 l-4 4 l4 4"/>
          <path d="M-10 12 L -16 2 L -10 -10"/><path d="M-14 -6 l4 -4 l4 2"/>
        </g>
      </g>
      </g>
    </svg>
  </div>
</div>

<script>
(function () {
  // Fade the parts in when the section scrolls into view (and again each time it comes back)
  const items = document.querySelectorAll(".reveal");
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { e.target.classList.toggle("in", e.isIntersecting); });
  }, { threshold: 0.15 });
  items.forEach(function (el) { io.observe(el); });

  function fit() {
    try { const h = document.getElementById("growth").offsetHeight + 4 + "px";
          window.frameElement.style.height = h;
    } catch (e) {}
  }
  window.addEventListener("load", fit); window.addEventListener("resize", fit); setTimeout(fit, 300);
  new ResizeObserver(fit).observe(document.getElementById("growth"));
})();
</script>
