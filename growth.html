<!-- "Driving Sustainable Growth" section: dark green glowing background, heading + bold text,
     and a glowing bulb held in a hand with eco icons around it. Slides in when it scrolls into view. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .growth { position: relative; overflow: hidden; border-radius: 14px; min-height: 430px;
    background:
      radial-gradient(circle at 82% 38%, rgba(255, 222, 60, .38) 0%, rgba(255, 222, 60, 0) 26%),
      radial-gradient(circle at 12% 18%, rgba(70, 160, 40, .55) 0%, rgba(70, 160, 40, 0) 30%),
      radial-gradient(circle at 45% 85%, rgba(30, 120, 30, .55) 0%, rgba(30, 120, 30, 0) 35%),
      radial-gradient(circle at 60% 10%, rgba(20, 90, 20, .6) 0%, rgba(20, 90, 20, 0) 30%),
      radial-gradient(circle at 28% 60%, rgba(5, 40, 5, .9) 0%, rgba(5, 40, 5, 0) 40%),
      linear-gradient(135deg, #052b07 0%, #0d4a12 35%, #062a08 65%, #031503 100%);
    display: flex; align-items: flex-start; }
  .text { position: relative; z-index: 2; width: 54%; padding: 30px 0 40px 4%; }
  h2 { font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; font-weight: 700;
       font-size: clamp(30px, 4.2vw, 46px); letter-spacing: 1px; color: #fff; margin: 0 0 22px 0; line-height: 1.15; }
  p  { font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; font-weight: 700; color: #fff;
       font-size: clamp(15px, 1.55vw, 18.5px); line-height: 1.75; text-align: justify; margin: 0;
       word-spacing: 2px; }
  .art { position: absolute; z-index: 1; right: -1%; top: -7%; width: 43%; height: 114%; }
  .art svg { width: 100%; height: 100%; }

  /* Scroll-in animation (like AOS "fade-up") */
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 1s ease, transform 1s ease; }
  .reveal.in { opacity: 1; transform: none; }
  .d1 { transition-delay: .15s; } .d2 { transition-delay: .4s; } .d3 { transition-delay: .25s; }
  .art.reveal { transform: translateY(40px) scale(.94); }
  .art.reveal.in { transform: none; }

  /* Glow and twinkle */
  .glow   { animation: pulse 3.2s ease-in-out infinite; transform-origin: 260px 190px; }
  .spark  { animation: twinkle 2.4s ease-in-out infinite; }
  .spin   { animation: spin 60s linear infinite; transform-origin: 260px 200px; }
  @keyframes pulse   { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes spin    { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .growth { flex-direction: column; }
    .text { width: auto; padding: 26px 22px 10px; }
    p { text-align: left; }
    .art { position: relative; right: auto; top: auto; width: 86%; height: auto; margin: 0 auto 10px; }
    .art svg { height: auto; display: block; }
  }
</style>

<div class="growth" id="growth">
  <div class="text">
    <h2 class="reveal d1">__TITLE__</h2>
    <p class="reveal d2">__TEXT__</p>
  </div>

  <div class="art reveal d3">
    <svg viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg" aria-label="Glowing bulb held in a hand">
      <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6b0" stop-opacity=".95"/>
          <stop offset="35%" stop-color="#ffe14a" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#ffd400" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glass" cx="42%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
          <stop offset="45%" stop-color="#fff3a6" stop-opacity=".45"/>
          <stop offset="80%" stop-color="#d9f0ff" stop-opacity=".18"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity=".35"/>
        </radialGradient>
        <linearGradient id="screw" x1="0" x2="1">
          <stop offset="0%" stop-color="#7d8790"/><stop offset="45%" stop-color="#e8edf1"/>
          <stop offset="100%" stop-color="#6b747c"/>
        </linearGradient>
        <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f6d2bd"/><stop offset="100%" stop-color="#d9a07f"/>
        </linearGradient>
        <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
        <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
      </defs>

      <!-- outer and inner rings -->
      <g class="spin">
        <circle cx="260" cy="200" r="205" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 7"/>
      </g>
      <circle cx="260" cy="200" r="150" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/>

      <!-- glowing lines from the bulb to each icon -->
      <g stroke="#ffe55c" stroke-width="2.2" stroke-opacity=".9" fill="none">
        <line x1="260" y1="200" x2="55"  y2="200"/>
        <line x1="260" y1="200" x2="115" y2="55"/>
        <line x1="260" y1="200" x2="260" y2="-5"/>
        <line x1="260" y1="200" x2="405" y2="55"/>
        <line x1="260" y1="200" x2="465" y2="200"/>
        <line x1="260" y1="200" x2="420" y2="330"/>
        <line x1="260" y1="200" x2="100" y2="330"/>
      </g>
      <!-- sparkling dots on the rings -->
      <g fill="#fff59a">
        <circle class="spark" style="animation-delay:0s"   cx="110" cy="200" r="6"/>
        <circle class="spark" style="animation-delay:.3s"  cx="154" cy="94"  r="6"/>
        <circle class="spark" style="animation-delay:.6s"  cx="260" cy="50"  r="6"/>
        <circle class="spark" style="animation-delay:.9s"  cx="366" cy="94"  r="6"/>
        <circle class="spark" style="animation-delay:1.2s" cx="410" cy="200" r="6"/>
        <circle class="spark" style="animation-delay:1.5s" cx="377" cy="294" r="6"/>
        <circle class="spark" style="animation-delay:1.8s" cx="143" cy="294" r="6"/>
        <circle class="spark" style="animation-delay:.45s" cx="72"  cy="200" r="4"/>
        <circle class="spark" style="animation-delay:1.05s" cx="389" cy="72" r="4"/>
        <circle class="spark" style="animation-delay:1.65s" cx="131" cy="72" r="4"/>
      </g>

      <!-- icon badges -->
      <g fill="rgba(10,40,10,.35)" stroke="#ffffff" stroke-opacity=".85" stroke-width="2">
        <circle cx="55"  cy="200" r="38"/>
        <circle cx="115" cy="55"  r="38"/>
        <circle cx="405" cy="55"  r="38"/>
        <circle cx="465" cy="200" r="38"/>
        <circle cx="420" cy="330" r="34"/>
        <circle cx="100" cy="330" r="34"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- sun (left) -->
        <circle cx="55" cy="200" r="10"/>
        <g transform="translate(55 200)">
          <line x1="0" y1="-16" x2="0" y2="-23"/><line x1="0" y1="16" x2="0" y2="23"/>
          <line x1="-16" y1="0" x2="-23" y2="0"/><line x1="16" y1="0" x2="23" y2="0"/>
          <line x1="11" y1="11" x2="16" y2="16"/><line x1="-11" y1="-11" x2="-16" y2="-16"/>
          <line x1="11" y1="-11" x2="16" y2="-16"/><line x1="-11" y1="11" x2="-16" y2="16"/>
        </g>
        <!-- fuel pump with drop (top left) -->
        <rect x="100" y="38" width="22" height="34" rx="3"/>
        <line x1="96" y1="72" x2="126" y2="72"/>
        <path d="M122 46 h6 a4 4 0 0 1 4 4 v14 a3 3 0 0 0 6 0 v-18 l-5 -5"/>
        <path d="M111 47 c-4 6 -6 9 -6 12 a6 6 0 0 0 12 0 c0 -3 -2 -6 -6 -12z" fill="#ffffff" fill-opacity=".9"/>
        <!-- leaf (top right) -->
        <path d="M388 72 C 386 42, 410 32, 426 36 C 430 56, 418 76, 388 72 Z"/>
        <path d="M388 72 L 418 44"/><path d="M400 62 l -2 -10"/><path d="M408 54 l 8 2"/>
        <!-- plant / sprout in a pot (right) -->
        <path d="M465 222 v-30"/>
        <path d="M465 200 c -14 -2 -20 -12 -20 -22 c 12 0 20 8 20 22z"/>
        <path d="M465 192 c 14 -2 20 -12 20 -22 c -12 0 -20 8 -20 22z"/>
        <path d="M451 222 h28 l -4 14 h-20 z"/>
        <!-- recycle (lower right) -->
        <path d="M420 312 l 9 15 h-8"/>
        <path d="M429 327 l -4 -8"/>
        <path d="M404 338 l 8 -14"/>
        <path d="M436 338 h-18"/>
        <path d="M413 312 l -10 18"/>
        <path d="M403 330 l 9 0"/>
        <path d="M437 336 l -8 -12"/>
        <!-- wind turbine (lower left) -->
        <line x1="100" y1="332" x2="100" y2="356"/>
        <path d="M100 332 l 0 -22"/><path d="M100 332 l 18 11"/><path d="M100 332 l -18 11"/>
        <circle cx="100" cy="332" r="3" fill="#ffffff"/>
      </g>

      <!-- bulb glow -->
      <circle class="glow" cx="260" cy="190" r="150" fill="url(#halo)" filter="url(#blur6)"/>
      <!-- bulb glass -->
      <path d="M260 95 C 205 95, 168 136, 168 188 C 168 222, 186 244, 204 262 C 216 275, 222 290, 222 306 L 298 306 C 298 290, 304 275, 316 262 C 334 244, 352 222, 352 188 C 352 136, 315 95, 260 95 Z"
            fill="url(#glass)" stroke="#ffffff" stroke-opacity=".85" stroke-width="2.2"/>
      <!-- shine on the glass -->
      <path d="M200 150 C 210 125, 232 112, 252 110" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".75" filter="url(#blur2)"/>
      <!-- filament -->
      <g class="glow" stroke="#fff3a0" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M244 300 L 240 230 Q 250 214 260 230 Q 270 214 280 230 L 276 300"/>
        <path d="M240 230 Q 230 210 246 205 Q 260 200 274 205 Q 290 210 280 230"/>
      </g>
      <!-- screw base -->
      <rect x="220" y="306" width="80" height="12" rx="4" fill="url(#screw)"/>
      <rect x="223" y="320" width="74" height="11" rx="4" fill="url(#screw)"/>
      <rect x="226" y="333" width="68" height="11" rx="4" fill="url(#screw)"/>
      <rect x="230" y="346" width="60" height="10" rx="4" fill="url(#screw)"/>
      <path d="M240 358 L 280 358 L 268 374 L 252 374 Z" fill="#3b4148"/>
      <circle cx="260" cy="378" r="6" fill="#c9d1d8"/>

      <!-- open hand under the bulb -->
      <g fill="url(#skin)" stroke="#b9805f" stroke-width="1.2" transform="translate(-30 -40) scale(1.1)">
        <!-- fingers (pointing right, gently curled) -->
        <path d="M300 420 C 350 404, 410 400, 452 408 C 470 412, 470 430, 452 432 C 410 434, 360 438, 312 446 Z"/>
        <path d="M304 446 C 356 438, 420 438, 462 446 C 480 450, 478 468, 460 469 C 420 470, 362 472, 312 474 Z"/>
        <path d="M300 474 C 350 470, 410 474, 448 482 C 464 486, 462 502, 446 502 C 408 501, 356 500, 306 500 Z"/>
        <path d="M290 500 C 334 498, 384 504, 416 512 C 430 516, 426 530, 412 530 C 380 528, 336 526, 292 524 Z"/>
        <!-- palm and wrist -->
        <path d="M120 560 C 140 500, 170 452, 222 418 C 248 402, 280 400, 306 414 L 318 520 C 300 540, 262 552, 220 560 Z"/>
        <!-- thumb -->
        <path d="M206 430 C 196 410, 200 390, 214 382 C 226 376, 238 382, 240 396 C 242 410, 236 422, 226 432 Z"/>
      </g>
      <!-- soft shadow under the bulb base onto the palm -->
      <ellipse cx="262" cy="404" rx="40" ry="8" fill="#000" opacity=".18" filter="url(#blur2)"/>
    </svg>
  </div>
</div>

<script>
(function () {
  // Fade the parts in when the section scrolls into view (and again each time it comes back)
  const items = document.querySelectorAll(".reveal");
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { e.target.classList.toggle("in", e.isIntersecting); });
  }, { threshold: 0.15 });
  items.forEach(function (el) { io.observe(el); });

  function fit() {
    try { const h = document.getElementById("growth").offsetHeight + 4 + "px";
          window.frameElement.style.height = h;
          window.frameElement.parentElement.style.height = h;   // the page box around this frame
    } catch (e) {}
  }
  window.addEventListener("load", fit); window.addEventListener("resize", fit); setTimeout(fit, 300);
  new ResizeObserver(fit).observe(document.getElementById("growth"));
})();
</script>
